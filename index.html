<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>MK11 Professional League</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="manifest" href="manifest.json">
    <link rel="apple-touch-icon" href="icon-192.png">
</head>
<body>

    <div class="bg-gradient"></div>
    <div class="scanlines"></div>
    <div id="fx-overlay" class="hidden"><h1 id="fx-text">FIGHT</h1></div>

    <div class="ios-header">
        <button onclick="switchView('hof-view')" class="nav-btn gold-border">🏆 السجل التاريخي</button>
        <h1 class="mk-logo" id="header-title">MK11 <span style="color:var(--col-gold)">LEAGUE</span></h1>
        <button onclick="goToBracket()" class="nav-btn">الجدول</button>
    </div>

    <div id="landing-view" class="view active">
        <div class="landing-card">
            <h1 class="big-logo">MORTAL KOMBAT 11</h1>
            <h3 class="sub-logo">TOURNAMENT MANAGER</h3>
            
            <div class="setup-form">
                <div class="form-group">
                    <label>اسم البطولة</label>
                    <input type="text" id="tourney-name" placeholder="مثلاً: بطولة رمضان الكبرى">
                </div>
                
                <div class="form-group">
                    <label>الجائزة (اختياري)</label>
                    <input type="text" id="tourney-prize" placeholder="مثلاً: 100$ / كأس ذهبي">
                </div>

                <button onclick="startSetup()" class="start-main-btn">إنشاء بطولة جديدة</button>
            </div>
        </div>
    </div>

    <div id="setup-view" class="view">
        <h2 class="view-title" id="setup-title-display">SELECT KOMBATANTS</h2>
        
        <div class="input-container">
            <input type="text" id="player-input" placeholder="اسم المقاتل..." onkeypress="handleEnter(event)">
            <button onclick="addPlayer()" class="add-btn">ADD</button>
        </div>

        <div class="kombat-grid" id="kombat-grid"></div>

        <div class="footer-bar">
            <span id="player-count">0 PLAYERS</span>
            <button onclick="initDrawCeremony()" class="start-btn" id="start-btn" disabled>START DRAW</button>
        </div>
    </div>

    <div id="draw-view" class="view">
        <div class="draw-container">
            <div class="draw-header"><span id="draw-match-num">MATCH #1</span></div>
            <div class="draw-arena">
                <div class="draw-side side-green" id="side-p1">
                    <div class="side-label">PLAYER 1</div>
                    <div class="draw-box name-box"><div class="rolling-text" id="roll-p1-name">???</div></div>
                    <div class="draw-box char-box"><div class="rolling-text char-font" id="roll-p1-char">???</div></div>
                </div>
                <div class="vs-center"><span class="vs-text">VS</span></div>
                <div class="draw-side side-red" id="side-p2">
                    <div class="side-label">PLAYER 2</div>
                    <div class="draw-box name-box"><div class="rolling-text" id="roll-p2-name">???</div></div>
                    <div class="draw-box char-box"><div class="rolling-text char-font" id="roll-p2-char">???</div></div>
                </div>
            </div>
            <div class="draw-controls">
                <button id="draw-action-btn" class="ios-btn-action" onclick="handleDrawStep()">سحب الاسم الأول</button>
            </div>
        </div>
    </div>

    <div id="bracket-view" class="view">
        <div class="bracket-wrapper">
            <div class="trophy-bg">🏆</div>
            <div class="bracket-tree" id="bracket-tree-container"></div>
        </div>
    </div>

    <div id="match-view" class="view">
        <div class="arena-card">
            <div class="arena-header"><span id="match-phase-badge">FINAL</span></div>
            <div class="fighters-row">
                <div class="fighter-card p1">
                    <div class="fighter-name" id="p1-name">...</div>
                    <div class="fighter-char" id="p1-char">...</div>
                    <div class="fighter-score" id="p1-score">0</div>
                </div>
                <div class="vs-badge">VS</div>
                <div class="fighter-card p2">
                    <div class="fighter-name" id="p2-name">...</div>
                    <div class="fighter-char" id="p2-char">...</div>
                    <div class="fighter-score" id="p2-score">0</div>
                </div>
            </div>
            <div class="rounds-section">
                <div class="round-strip" id="round-1-strip"><div class="r-chk p1-chk" id="r1-p1" onclick="triggerRoundWin(1,'p1')"></div><span class="r-title">ROUND 1</span><div class="r-chk p2-chk" id="r1-p2" onclick="triggerRoundWin(1,'p2')"></div></div>
                <div class="round-strip" id="round-2-strip"><div class="r-chk p1-chk" id="r2-p1" onclick="triggerRoundWin(2,'p1')"></div><span class="r-title">ROUND 2</span><div class="r-chk p2-chk" id="r2-p2" onclick="triggerRoundWin(2,'p2')"></div></div>
                <div class="round-strip hidden" id="round-3-strip"><div class="r-chk p1-chk" id="r3-p1" onclick="triggerRoundWin(3,'p1')"></div><span class="r-title gold-text">FINAL ROUND</span><div class="r-chk p2-chk" id="r3-p2" onclick="triggerRoundWin(3,'p2')"></div></div>
            </div>
            <div class="arena-footer">
                <button onclick="confirmMatchResult()" class="finish-btn hidden" id="finish-match-btn">FINISH HIM</button>
                <button onclick="closeMatch()" class="back-btn">عودة</button>
            </div>
        </div>
    </div>

    <div id="champion-view" class="view">
        <div class="glass-card champion-card">
            <div class="trophy-icon">🏆</div>
            <h2 class="champ-label">THE CHAMPION</h2>
            <h1 id="champion-name" class="neon-champ">NAME</h1>
            <h3 id="champion-char" class="mk-font-gold">CHAR</h3>
            <div class="prize-display" id="prize-display"></div>
            <button onclick="saveToHistory()" class="start-btn">حفظ في السجل وإنهاء</button>
        </div>
    </div>

    <div id="hof-view" class="view">
        <div class="hof-header">
            <h2 class="mk-font-gold">سجل الأبطال (HALL OF FAME)</h2>
            <button onclick="clearHistory()" class="text-btn-small">مسح البيانات</button>
        </div>
        
        <div class="table-container">
            <table class="hof-table">
                <thead>
                    <tr>
                        <th>الترتيب</th>
                        <th>اسم اللاعب</th>
                        <th>الألقاب 🏆</th>
                        <th>نهائيات 🏁</th>
                        <th>الجوائز 🎁</th>
                    </tr>
                </thead>
                <tbody id="hof-tbody">
                    </tbody>
            </table>
        </div>

        <div style="text-align:center; margin-top:30px;">
            <button onclick="location.reload()" class="back-btn">القائمة الرئيسية</button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
